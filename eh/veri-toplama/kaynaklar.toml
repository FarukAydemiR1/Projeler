# EH laboratuvarı – eğitim verisi kaynak listesi
# Her [[depo]] belirtilen sürüm etiketinden (ref) indirilir.
# ref = "HEAD" olanların sürüm etiketi yok; o anki commit kaydedilir.
# dahil: hangi klasör/dosyalar alınacak (glob). Belge, örnek, test ve API kaynağı hedeflenir.
# lisans: deponun bildirdiği lisans. "NC" = ticari olmayan kullanım şartı var.
# kategori: sdr | dsp | ml | gnss | radar | df | olcum | em | fpga | standart

[[depo]]
ad = "gnuradio"
url = "https://github.com/gnuradio/gnuradio.git"
