# Günlük hisse sinyal taraması — Stock_Signal_Agent
#
# Her iş günü BIST kapanışından sonra (18:15 TSİ ≈ 15:15 UTC) izleme listesini
# tarar ve raporu Telegram'a gönderir.
#
# Kurulum (bir kere):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     TELEGRAM_BOT_TOKEN : @BotFather'dan aldığın bot token'ı
#     TELEGRAM_CHAT_ID   : kendi chat id'n
#   Secrets yoksa iş yine çalışır, rapor sadece Actions log'unda görünür.

name: Daily Stock Signal Scan

on:
  schedule:
    # Pzt-Cum 15:17 UTC (18:17 TSİ) — BIST ve ABD açılış sonrası
    - cron: "17 15 * * 1-5"
  workflow_dispatch: {}   # elle tetikleme

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Stock_Signal_Agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Stock_Signal_Agent/requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Modeli önbellekten getir
        uses: actions/cache@v4
        with:
          path: Stock_Signal_Agent/signal_model.joblib
          key: signal-model-v1-${{ github.run_number }}
          restore-keys: signal-model-v1-

      - name: Günlük tarama + bildirim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m stock_signal_agent.cli daily \
            --market all \
            --train-if-missing
